[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
config = { path = "../config" }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
strsim = "0.11.1"
unicode-normalization = "0.1.23"
async-trait = "0.1.86"
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0.11"
tinytemplate = "1.1"
slug = { workspace = true }
schemars = "0.8.22"
rocket_okapi = { workspace = true }
reqwest = { version = "0.12.5", default-features = false, features = ["json", "socks", "rustls-tls"] }
symphonia = "0.5.4"
sha2 = "0.10.8"
hex = "0.4.3"
tokio = { workspace = true, features = ["process"] }

[features]
default = []
diesel_integration = ["diesel"]

[dependencies.diesel]
workspace = true
optional = true
