[package]
name = "fetcher"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
config = { path = "../config" }
ai = { path = "../ai" }

tracing = { workspace = true }

rspotify = { workspace = true }
rustypipe = { workspace = true }
rsoundcloud = { version = "0.2.6" }
# rsoundcloud = { path = "../../../rsoundcloud" } # for local testing purposes

tokio = { workspace = true, features = ["sync"] }
futures = "0.3.31"
async-trait = { workspace = true }
fancy-regex = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "socks", "rustls-tls"] }
