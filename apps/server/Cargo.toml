[package]
name = "soundome-server"
description = "Soundome server"
version = "0.4.0"
edition = "2021"
authors = [
    "Bartholomé Gili <dev.bartho@gmail.com",
]
repository = "https://github.com/barthofu/soundome"
readme = "README.md"
keywords = [
    "soundome",
    "music",
    "server",
    "api"
]

[dependencies]
domain = { path = "../../packages/domain" }
shared = { path = "../../packages/shared" }
config = { path = "../../packages/config" }
database = { path = "../../packages/database" }
tagger = { path = "../../packages/tagger" }
walkdir = "2"
chrono = { workspace = true }

tracing-subscriber = { workspace = true }
tracing = { workspace = true }

rocket = { workspace = true }
rocket_sync_db_pools = { version = "0.1.0", features = ["diesel_sqlite_pool"] }
diesel = { workspace = true, features = ["sqlite", "r2d2"] }
libsqlite3-sys = { workspace = true }
rocket_okapi = { workspace = true }
okapi = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0.11"
tokio = { workspace = true, features = ["full"] }
dotenvy = { git = "https://github.com/allan2/dotenvy", features = ["macros"] }
