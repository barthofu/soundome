[package]
name = "soundome-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing the Soundome HTTP API to LLM clients"

[[bin]]
name = "soundome-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1.44.2", features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
