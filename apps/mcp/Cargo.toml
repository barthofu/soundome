[package]
name = "soundome-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing the Soundome HTTP API to LLM clients"

[[bin]]
name = "soundome-mcp"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = "0.7"
clap = { workspace = true }
reqwest = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
