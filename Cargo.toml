[profile.release]
strip = true
lto = true

[workspace]
resolver = "2"
members = [
    "apps/server",
    "packages/shared", "packages/database",
    "packages/downloader",
    "packages/fetcher", "packages/domain",
    "packages/tagger", "apps/cli",
    "packages/config", "packages/ai", "packages/organizer",
    "apps/mcp"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1.88"
audiotags = "0.5.0"
chrono = "0.4.39"
clap = { version = "4", features = ["derive", "env"] }
diesel = { version = "2.2.7" }
libsqlite3-sys = { version = "0.31.0", features = ["bundled"] }
okapi = "0.7.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rocket = { version = "0.5.1", features = ["json"] }
rocket_okapi = { version = "0.9.0", features = ["swagger"] }
rspotify = { version = "0.16.1", default-features = false, features = [
    "env-file",
    "client-ureq",
    "ureq-rustls-tls",
] }
rustypipe = "0.11.4"
schemars = "0.8.21"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
slug = "0.1.6"
tokio = "1.44.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
